services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "exec npx --yes live-server@1.2.2 --host=0.0.0.0 --port=3000 --no-browser --wait=200 --ignore=.git"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ | grep -q 'NEXUS' || (echo 'web: index not served' && exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
