services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
    # Static site, no build step: files are read from the bind mount on every request.
    command: ["python3", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:3000/index.html',timeout=3); sys.exit(0 if b'NEXUS' in r.read() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
